<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoopIt prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#080C18;--card:#0F1628;--card2:#141E35;--line:#1C2845;--tx:#E8EDF8;--mu:#7D8BAA;--or:#FF5500;--gr:#00C896;--rd:#FF4D5E}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEF1F7;--card:#fff;--card2:#F3F5FA;--line:#DCE1EC;--tx:#101830;--mu:#5B6785}}
:root[data-theme="light"]{--bg:#EEF1F7;--card:#fff;--card2:#F3F5FA;--line:#DCE1EC;--tx:#101830;--mu:#5B6785}
:root[data-theme="dark"]{--bg:#080C18;--card:#0F1628;--card2:#141E35;--line:#1C2845;--tx:#E8EDF8;--mu:#7D8BAA}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 'DM Sans',system-ui,sans-serif;padding:14px}
h1,h2,h3,.d{font-family:'Outfit',system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
header h1{font-size:22px}header h1 b{color:var(--or)}
.demo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mu);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:9px 12px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
button.on,button.p{background:var(--or);border-color:var(--or);color:#fff}
button.g{background:var(--gr);border-color:var(--gr);color:#04140F}
button.r{color:var(--rd)}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{display:grid;gap:14px;grid-template-columns:1fr}
.pane{display:none}.pane.show{display:block}
@media(min-width:1100px){.tabs{display:none}.wrap{grid-template-columns:390px 390px 1fr;align-items:start}.pane{display:block}}
.phone{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px;min-height:640px;max-width:420px;margin:auto;width:100%}
.admin{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ttl h2{font-size:18px}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--or) 16%,transparent);color:var(--or);font-weight:600}
.tag.g{background:color-mix(in srgb,var(--gr) 16%,transparent);color:var(--gr)}
.tag.r{background:color-mix(in srgb,var(--rd) 16%,transparent);color:var(--rd)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.tier{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:10px 12px;margin-top:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.tier.sel{border-color:var(--or);box-shadow:0 0 0 1px var(--or)}
.tier s{color:var(--mu);font-size:12px}
.err{color:var(--rd);background:color-mix(in srgb,var(--rd) 12%,transparent);border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13px}
.box{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.big{font:800 26px 'Outfit'}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:40%;background:var(--or);border-radius:6px;animation:mv 1.8s ease-in-out infinite}
@keyframes mv{0%{margin-left:-40%}100%{margin-left:100%}}
@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:70%}}
.steps{display:flex;gap:4px;margin-top:10px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.d{background:var(--gr)}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.k div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.k b{display:block;font:800 20px 'Outfit'}.k span{font-size:11px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mu);font-weight:500}
.tw{overflow-x:auto}
.log{max-height:170px;overflow:auto;font-size:12px;color:var(--mu)}.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.two{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px) and (max-width:1099px){.two{grid-template-columns:1fr 1fr}}
.map{height:120px;border-radius:12px;background:var(--card2);border:1px solid var(--line);position:relative;overflow:hidden}
.map span{position:absolute;font-size:11px;padding:2px 7px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.small{font-size:12px;color:var(--mu)}h2 b{color:var(--or)}.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.d{background:var(--or)}.ring{width:96px;height:96px;margin:0 auto;border-radius:50%;border:8px solid var(--or);border-right-color:transparent;animation:sp 2.2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ring{animation:none}}
</style></head><body>
<header><h1 class="d">Loop<b>It</b> <span class="small">prototype · Final Release flow</span></h1>
<div class="demo">Demo controls:
<button id="skip">Skip 20-min window</button><button id="rej">All agents reject</button><button id="rst">Reset</button></div></header>
<div class="tabs"><button data-t="c" class="on">Customer</button><button data-t="a">Agent</button><button data-t="s">Super Admin</button></div>
<div class="wrap"><section class="pane show" id="c"></section><section class="pane" id="a"></section><section class="pane" id="s"></section></div>
<script>
const CFG={offer:30,tiers:{sched:{n:'Scheduled',b:20,k:1.2,m:30,eta:'Fixed slot'},shared:{n:'Shared Standard',b:28,k:2,m:40,eta:'30–45 min'},express:{n:'Express',b:60,k:3,m:75,eta:'15–25 min'}},
hubs:{sp:'SP Road',kl:'Kalasipalya',out:'Whitefield (outside service area)'},drops:{6:'Indiranagar · 6 km',9:'Jayanagar · 9 km',14:'Koramangala · 14 km'}};
const OUT='Sorry, Loopit currently delivers from SP Road and Kalasipalya areas only. We are expanding soon.';
const fresh=()=>({f:{pick:'sp',drop:6,qty:1,desc:'',decl:false,veh:'2W',tier:'shared'},msg:'',o:null,log:[],earn:0,n:0,bonus:0,rev:0,t:CFG.offer,otp:'',photo:false,otpErr:'',agent:true,refund:null,cu:null,cs:'phone',cph:'',ce:'',ct:'home',ad:[{l:'Home',a:'4th Cross, SP Road',z:'sp'},{l:'Warehouse',a:'Market Lane, Kalasipalya',z:'kl'}],ag:{st:'login',ph:'',vn:'',dk:{}},ae:'',at:'dash',opening:350,paid:0,tx:[{t:'Yesterday',m:'Delivery earnings',a:350}],py:null,pe:'',sus:null,wa:'',sc:0,sa:0,bt:null,dyn:null,shift:'Morning',sos:0,hist:[{id:'LP2041',t:'Shared Standard',r:'SP Road → Indiranagar',p:46,s:'Delivered'},{id:'LP2037',t:'Express',r:'Kalasipalya → Jayanagar',p:99,s:'Delivered'}]});
let S=fresh(),tm=null;
const $=id=>document.getElementById(id);
const L=m=>S.log.unshift({t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}),m});
const fare=(t,d,q,v)=>{const c=CFG.tiers[t],km=Math.max(3,d);return Math.round(Math.max(c.m,c.b+c.k*km)*q*(v==='3W'?1.4:1))};
const agentPay=(d)=>Math.max(28+6*d,d*10);
const DIR={6:'East',9:'South',14:'South-East'};
const bq=()=>S.bt?S.bt.orders.reduce((a,x)=>a+x.q,0):(S.o?S.o.qty:0);
function openBatch(){const f=S.f;S.bt={id:'B-'+Math.floor(100+Math.random()*900),hub:f.pick,dir:DIR[f.drop],orders:[{id:S.o.id,who:'You',q:f.qty}]};L(`Batch ${S.bt.id} opened · hub ${CFG.hubs[f.pick]} · direction ${S.bt.dir} · 20-min window started`);if(bq()>=5)lockBatch()}
function lockBatch(){L(`Batch ${S.bt.id} reached 5 parcels · locked immediately · offering to agents`);offer()}
function addShared(same){if(!S.bt||S.o.st!=='MATCHING')return;
 if(!same){L('Order heading West is a different direction · not grouped, starts its own batch');return draw()}
 const q=Math.min(5-bq(),1+Math.floor(Math.random()*2));S.bt.orders.push({id:'LP'+Math.floor(1000+Math.random()*9000),who:'Sender '+String.fromCharCode(65+S.bt.orders.length),q});
 L(`Same hub and direction order added · ${bq()}/5 parcels`);if(bq()>=5)lockBatch();draw()}
const SPL={c:[['Loop<b>It</b>','Share the route. Split the cost.'],['Book in a minute','Enter pickup, drop and parcel details. See the price and your savings before you pay.'],['Ride along, pay less','Parcels heading the same way share one agent, so delivery costs less.'],['Track every step','Live tracking, pickup and delivery OTPs, and a proof photo at the door.']],a:[['Loop<b>It</b> Agent','Deliver more parcels on every trip.'],['Take shared batches','Accept batches of up to 5 parcels on your route, with no daily limit.'],['Earn more per trip','₹30 bonus on every batch of 3+ parcels.'],['Cash out from ₹100','Request a payout to your UPI. Admin approves it.']]};
function splash(w){const i=w==='c'?S.sc:S.sa,x=SPL[w][i],last=i===3;
 return `<div class="phone" style="display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center">${i?'':'<div class="ring"></div>'}<h2 style="font-size:${i?24:34}px">${x[0]}</h2><p style="color:var(--mu)">${x[1]}</p><div class="dots">${[0,1,2,3].map(n=>`<i class="${n===i?'d':''}"></i>`).join('')}</div><button class="p" data-sp="${w}">${i===0?'Get started':last?(w==='c'?'Log in or register':'Start as agent'):'Next'}</button>${i&&!last?`<button data-ss="${w}">Skip</button>`:''}</div>`}
const stepIdx={MATCHING:0,OFFERED:0,UNASSIGNED:0,AGENT_ASSIGNED:1,COLLECTED:2,AT_DELIVERY:2,PROOF_UPLOADED:3,DELIVERED:4};
function pay(){const f=S.f;S.msg='';
 if(f.pick==='out'){S.msg=OUT;return draw()}
 if(!f.desc.trim())S.msg='Add a parcel description.';
 else if(f.qty<1||f.qty>5)S.msg='Quantity must be between 1 and 5 parcels.';
 else if(!f.decl)S.msg='Accept the prohibited-items declaration to continue.';
 if(S.msg)return draw();
 const amt=fare(f.tier,f.drop,f.qty,f.veh);S.rev+=amt;
 S.o={id:'LP'+Math.floor(1000+Math.random()*9000),...f,d:+f.drop,amt,st:'MATCHING',pOtp:String(Math.floor(1000+Math.random()*9000)),dOtp:String(Math.floor(1000+Math.random()*9000))};
 S.bt=null;S.dyn=null;L(`Razorpay payment SUCCESS ₹${amt} · declaration stored · order ${S.o.id} created`);
 if(f.tier==='express'){L('Express: shared batching bypassed');offer()}
 else if(f.tier==='sched'){L('Scheduled: advance-paid, assigned at slot');offer()}
 else openBatch();
 draw()}
function offer(){S.o.st='OFFERED';S.t=CFG.offer;S.otp='';S.photo=false;S.otpErr='';L('Offer sent to agent · timer '+CFG.offer+'s');clearInterval(tm);
 tm=setInterval(()=>{S.t--;const e=$('tm');if(e)e.textContent=S.t+'s';if(S.t<=0){clearInterval(tm);reject('timeout')}},1000)}
function reject(w){clearInterval(tm);if(!S.o||!['OFFERED','MATCHING'].includes(S.o.st))return;S.o.st='UNASSIGNED';L(w==='timeout'?'Offer timed out · no agents left in zone':'All zone agents rejected · order UNASSIGNED · admin alert fired');draw()}
function setSt(st,m){S.o.st=st;if(m)L(m);draw()}
function done(){const o=S.o;const e=Math.round(agentPay(o.d))*(S.bt?S.bt.orders.length:1);const b=(o.tier==='shared'&&bq()>=3)?30:0;S.earn+=e+b;S.bonus+=b;S.n++;S.tx.unshift({t:'Today',m:'Delivery '+o.id+(b?' + batch bonus':''),a:e+b});S.hist.unshift({id:o.id,t:CFG.tiers[o.tier].n,r:CFG.hubs[o.pick]+' → '+CFG.drops[o.drop].split(' · ')[0],p:o.amt,s:'Delivered'});L(`Delivered · receiver OTP verified · agent +₹${e}${b?' +₹30 batch bonus':''}`);setSt('DELIVERED')}
function cancel(by){const o=S.o,p=['MATCHING','OFFERED','UNASSIGNED'].includes(o.st)||by==='admin'?100:o.st==='AGENT_ASSIGNED'?50:0;
 clearInterval(tm);S.refund={p,amt:Math.round(o.amt*p/100)};S.rev-=S.refund.amt;setSt('CANCELLED',`${by==='admin'?'Admin':'Customer'} cancelled · refund ${p}% (₹${S.refund.amt})`)}
function cust(){
 const W=(t,b)=>`<div class="phone"><div class="ttl"><h2>${t}</h2><span class="tag g">Customer app</span></div>${b}</div>`;
 const E=S.ce?`<div class="err">${S.ce}</div>`:'';
 if(S.sc<4)return splash('c');
 if(!S.cu)return W('Log in or register',S.cs==='phone'?`<p class="small">New numbers are registered automatically.</p><label>Mobile number</label><input id="cph" inputmode="numeric" maxlength="10" placeholder="10-digit number" value="${S.cph}">${E}<button class="p" id="cgo" style="width:100%;margin-top:14px">Send OTP</button>`:`<p class="small">OTP sent to +91 ${S.cph}. Demo OTP: 1234</p><label>Enter OTP</label><input id="cotp" inputmode="numeric" maxlength="4" placeholder="4 digits">${E}<button class="p" id="cver" style="width:100%;margin-top:14px">Verify and continue</button><button id="cchg" style="width:100%;margin-top:8px">Change number</button>`);
 const nav=`<div class="row" style="margin-top:14px">${[['home','Home'],['book','Book'],['addr','Addresses'],['prof','Profile']].map(([k,n])=>`<button data-ct="${k}" class="${S.ct===k?'on':''}">${n}</button>`).join('')}</div>`;
 if(S.ct==='home'){const act=S.o&&!['DELIVERED','CANCELLED'].includes(S.o.st);
  const st={MATCHING:'Order confirmed · pickup in 30–45 min',OFFERED:'Order confirmed · pickup in 30–45 min',UNASSIGNED:'Order confirmed · pickup in 30–45 min',AGENT_ASSIGNED:'Agent is heading to pickup',COLLECTED:'On the way to the drop',AT_DELIVERY:'Agent is at the delivery address',PROOF_UPLOADED:'Completing delivery'};
  return W('Home',`<p style="font-size:18px;font-weight:600">Hi, Priya</p><div class="box row" style="align-items:center"><span><span class="small">Current location</span><br><b>SP Road, Bengaluru</b></span><span class="tag g" style="flex:none">In service area</span></div>
<button class="p" data-ct="book" style="width:100%;margin-top:12px;padding:14px">New booking</button>
${act?`<div class="box"><div class="ttl" style="margin:0"><b>Active · ${S.o.id}</b><span class="tag">${CFG.tiers[S.o.tier].n}</span></div><p class="small">${st[S.o.st]}</p><button data-ct="book" style="width:100%;margin-top:8px">Track order</button></div>`:''}
<div class="box" style="background:var(--or);border-color:var(--or);color:#fff"><b class="d" style="font-size:16px">Save up to 45% with Shared Standard</b><br><span style="font-size:13px">Parcels going your way share one agent.</span></div>
<label>Delivery types</label><div class="row">${Object.entries(CFG.tiers).map(([k,t])=>`<button data-th="${k}" style="padding:8px 6px;font-size:12px"><b>${t.n}</b><br><span class="small">from ₹${t.m}</span></button>`).join('')}</div>
<label>Book from a saved address</label><div class="row" style="flex-wrap:wrap">${S.ad.map((x,i)=>`<button data-qh="${i}" style="flex:none;font-size:12px;padding:5px 9px">${x.l}</button>`).join('')||'<span class="small">No saved addresses yet.</span>'}</div>
<label>Recent bookings</label>${S.hist.slice(0,3).map(x=>`<div class="box row small" style="align-items:center;margin-top:6px"><span><b>${x.t}</b> · ${x.id}<br>${x.r}</span><span style="flex:none;text-align:right">₹${x.p}<br>${x.s}</span></div>`).join('')}`+nav)}
 if(S.ct==='book')return book().replace(/<\/div>$/,nav+'</div>');
 if(S.ct==='addr')return W('Saved addresses',S.ad.map((x,i)=>`<div class="box row" style="align-items:center"><span><b>${x.l}</b><br><span class="small">${x.a} · ${CFG.hubs[x.z]}</span></span><button class="r" data-del="${i}" style="flex:none">Remove</button></div>`).join('')+`<label>Label</label><input id="al" placeholder="Home, Office, Shop"><label>Address</label><input id="aa" placeholder="Street, area"><label>Area</label><select id="az">${Object.entries(CFG.hubs).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>${E}<button class="p" id="aadd" style="width:100%;margin-top:10px">Save address</button><p class="small" style="margin-top:8px">Saved addresses show up as quick-select buttons when you book.</p>`+nav);
 return W('Profile',`<div class="box"><b>Priya Traders</b><br><span class="small">+91 ${S.cph}</span></div><div class="box small">${S.ad.length} saved addresses. Order history and invoices appear here after delivery.</div><button class="r" id="lo" style="width:100%;margin-top:12px">Log out</button>`+nav)}
function book(){const o=S.o,f=S.f;let h=`<div class="phone"><div class="ttl"><h2>${o?'Booking '+o.id:'New booking'}</h2><span class="tag g">Customer app</span></div>`;
 if(!o){const tiers=Object.entries(CFG.tiers).map(([k,t])=>{const p=fare(k,f.drop,f.qty,f.veh);return `<button class="tier ${f.tier===k?'sel':''}" data-tier="${k}"><span><b>${t.n}</b><br><span class="small">ETA ${t.eta}</span></span><span style="text-align:right"><s>₹${Math.round(p*1.8)}</s><br><b>₹${p}</b></span></button>`}).join('');
 h+=`<label>Pickup</label><div class="row" style="flex-wrap:wrap;margin-bottom:6px">${S.ad.map((x,i)=>`<button data-qa="${i}" style="flex:none;font-size:12px;padding:5px 9px">${x.l}</button>`).join('')}</div><select data-k="pick">${Object.entries(CFG.hubs).map(([k,v])=>`<option value="${k}" ${f.pick===k?'selected':''}>${v}</option>`).join('')}</select>
 <label>Drop</label><select data-k="drop">${Object.entries(CFG.drops).map(([k,v])=>`<option value="${k}" ${f.drop==k?'selected':''}>${v}</option>`).join('')}</select>
 <div class="row"><div><label>Parcels</label><input type="number" min="1" max="5" value="${f.qty}" data-k="qty"></div><div><label>Vehicle</label><select data-k="veh"><option value="2W" ${f.veh==='2W'?'selected':''}>2-wheeler</option><option value="3W" ${f.veh==='3W'?'selected':''}>3-wheeler</option></select></div></div>
 <label>Parcel description</label><input value="${f.desc.replace(/"/g,'&quot;')}" placeholder="e.g. 2 boxes of handmade candles" data-k="desc">
 <label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx)"><input type="checkbox" style="width:auto;margin-top:3px" ${f.decl?'checked':''} data-k="decl">I confirm this parcel has no prohibited items.</label>
 <label>Delivery type</label>${tiers}
 ${S.msg?`<div class="err">${S.msg}</div>`:''}
 <button class="p" id="pay" style="width:100%;margin-top:14px">Pay ₹${fare(f.tier,f.drop,f.qty,f.veh)} with Razorpay</button><p class="small" style="margin-top:8px">UPI, credit and debit cards. Prices come from admin configuration.</p>`}
 else{const i=stepIdx[o.st]??0;const lab=['Confirmed','Agent assigned','On the way','Proof uploaded','Delivered'];
 h+=`<div class="steps">${lab.map((_,j)=>`<i class="${o.st==='CANCELLED'?'':j<=i?'d':''}"></i>`).join('')}</div>`;
 if(['MATCHING','OFFERED','UNASSIGNED'].includes(o.st))h+=`<div class="box"><div class="big">Order confirmed</div><p>Estimated pickup in 30–45 min</p><div class="bar"><i></i></div></div>`;
 if(o.st==='AGENT_ASSIGNED')h+=`<div class="box"><b>Ravi K. · ${o.veh==='2W'?'Honda Activa':'Piaggio Ape'} · ★4.8</b><p class="small">Agent accepted. Live tracking on.</p><div class="map"><span style="left:14%;top:60%">Pickup</span><span style="left:70%;top:18%">Drop</span><span style="left:38%;top:38%;background:var(--or);color:#fff;border-color:var(--or)">Ravi</span></div><p style="margin-top:8px">Share pickup OTP with agent: <b class="big">${o.pOtp}</b></p></div>`;
 if(['COLLECTED','AT_DELIVERY','PROOF_UPLOADED'].includes(o.st))h+=`<div class="box"><b>Parcel is in transit</b><div class="map"><span style="left:55%;top:35%;background:var(--or);color:#fff;border-color:var(--or)">Ravi</span><span style="left:74%;top:16%">Drop</span></div>${o.st==='PROOF_UPLOADED'?`<p style="margin-top:8px">Receiver OTP: <b class="big">${o.dOtp}</b></p>`:''}</div>`;
 if(o.st==='DELIVERED')h+=`<div class="box"><div class="big" style="color:var(--gr)">Delivered</div><p>You saved ₹${Math.round(o.amt*.8)} vs standard courier. Shared routes also cut carbon emissions.</p><p class="small">Proof photo and OTP time saved to history.</p></div>`;
 if(o.st==='CANCELLED')h+=`<div class="box"><div class="big" style="color:var(--rd)">Cancelled</div><p>Refund ${S.refund.p}% · ₹${S.refund.amt} to original payment method.</p></div>`;
 h+=`<div class="box small">${o.amt?`Paid ₹${o.amt} · ${CFG.tiers[o.tier].n} · ${o.qty} parcel${o.qty>1?'s':''} · ${CFG.hubs[o.pick]}`:''}</div>`;
