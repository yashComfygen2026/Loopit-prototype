<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loopit Customer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffcf9;--navy:#102a43;--ink:#011d35;--mu:#667085;--mu2:#627d98;--br:#5c4038;--or:#ff4b0b;--grad:linear-gradient(135deg,#ff4b0b,#ff5a00);--pe:#fff1e8;--pe2:#ffe1cc;--pe3:#ffdbcf;--ln:#e5e7eb;--ln2:#f3f4f6;--bl:#eef4ff;--bl2:#e4efff;--bl3:#dbe9ff;--gr:#10b981;--rd:#d92d20;--pj:'Plus Jakarta Sans',system-ui,sans-serif;--in:'Inter',system-ui,sans-serif;--sh:0 4px 20px -2px rgba(255,75,11,.06),0 2px 6px -1px rgba(16,42,67,.04)}
*{box-sizing:border-box;margin:0}
body{background:#f2f4f7;font:14px/20px var(--in);color:var(--navy)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--or);text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--or);outline-offset:2px}
img{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stage{min-height:100vh;display:flex;flex-wrap:wrap;gap:32px;align-items:center;justify-content:center;padding:24px 16px}
.phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 0 0 6px rgba(15,23,42,.1),0 25px 50px -12px rgba(0,0,0,.25);flex:none}
#app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
.scr{min-height:100%;display:flex;flex-direction:column}
.grow{flex:1}
.v{position:absolute}.v img{width:100%;height:100%}
.ico{position:relative;display:block;width:20px;height:20px;overflow:hidden;flex:none}

/* status bar + headers */
.sb{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 8px;font:700 14px/20px var(--pj);letter-spacing:-.35px;color:var(--navy)}
.sbi{display:flex;align-items:center;gap:8px}
.wifi{position:relative;display:block;width:16px;height:14px}
.bat{position:relative;width:20px;height:10px;border:1px solid var(--navy);border-radius:2px;padding:2px;display:flex;margin-right:2.5px}
.bat::before{content:'';flex:1;background:var(--navy);border-radius:1px}
.bat::after{content:'';position:absolute;right:-3.5px;top:2px;width:2px;height:4px;background:var(--navy)}
.hd{position:sticky;top:0;z-index:6;background:rgba(255,252,249,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln2);box-shadow:0 1px 8px rgba(0,0,0,.03)}
.hd .sb{padding:6px 16px 0;font:600 11px/14px var(--in);letter-spacing:-.275px;color:var(--ink)}
.hdr{height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px}
.back{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;box-shadow:0 2px 8px -2px rgba(16,42,67,.06);display:grid;place-items:center}
.ht{flex:1;min-width:0;text-align:center;font:600 18px/24px var(--pj);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{width:44px;flex:none}
.hd.t{background:rgba(248,249,255,.85);border-bottom:0;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.hd.t .hdr{height:64px}
.hd.t .ht{text-align:left;letter-spacing:-.45px}
.hrow{display:flex;align-items:center;gap:8px;min-width:0;padding-left:4px}
.hb44{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center}

/* shared blocks */
.bd{flex:1;padding:0 16px 24px}
.bd.pt{padding-top:16px}
.ft{position:sticky;bottom:0;z-index:5;padding:13px 16px 20px;background:rgba(255,252,249,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1px solid var(--ln2);display:flex;flex-direction:column;gap:12px}
.cta{position:relative;width:100%;height:52px;flex:none;border-radius:9999px;background:var(--grad);color:#fff;font:700 14px/20px var(--in);display:flex;gap:8px;align-items:center;justify-content:center;box-shadow:0 10px 25px -5px rgba(255,75,11,.4)}
.cta.sq{height:48px;border-radius:12px;letter-spacing:.35px;box-shadow:0 6px 8px rgba(255,75,11,.28)}
.cta.lg{font:600 18px/24px var(--pj);margin-top:24px;box-shadow:0 8px 12px rgba(215,59,0,.36)}
.cta.red{background:var(--rd);box-shadow:none}
.sec{width:100%;height:48px;flex:none;border-radius:9999px;border:1px solid var(--ln);background:#fff;font:600 14px/20px var(--in);color:var(--ink);display:flex;align-items:center;justify-content:center}
.sec.r{color:var(--rd)}
.lnk{font:700 12px/16px var(--in);color:var(--or);display:inline-flex;align-items:center;gap:2px}
.stt{font:700 18px/24px var(--pj);color:var(--ink)}
.sts{font:400 12px/16px var(--in);color:var(--br);margin:2px 0 16px}
.cap{display:block;font:600 11px/14px var(--in);letter-spacing:.55px;text-transform:uppercase;color:var(--mu)}
.mb8{margin-bottom:8px}
.h2s{font:700 14px/21px var(--pj);color:var(--navy);padding:0 4px;margin:20px 0 8px}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.ic36,.ic40,.ic44,.ic48{flex:none;border-radius:50%;background:var(--pe);display:grid;place-items:center}
.ic36{width:36px;height:36px}.ic40{width:40px;height:40px}.ic48{width:48px;height:48px}
.rad{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);background:#fff;display:grid;place-items:center}
.on>.rad,.sel>.rad{background:var(--or);border-color:var(--or);box-shadow:0 1px 1px rgba(0,0,0,.05)}
.on>.rad::after,.sel>.rad::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.ferr{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fef3f2;color:#b42318;font:500 12px/18px var(--in)}
.note{font:400 12px/18px var(--in);color:var(--mu);margin:12px 4px 0}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.homeind{height:4px;width:128px;border-radius:9999px;background:rgba(16,42,67,.8)}

/* step indicator */
.stp{position:relative;display:flex;justify-content:space-between;max-width:320px;margin:16px auto 24px;padding:0 3px}
.stpl{position:absolute;left:17px;right:17px;top:14px;height:3px;background:var(--ln);border-radius:9999px}
.stpl i{display:block;height:100%;background:var(--or);border-radius:9999px}
.st{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px/14px var(--in);letter-spacing:.22px;color:#9ca3af}
.st b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ln);color:#6b7280;font:500 12px/16px var(--in)}
.st.done,.st.cur{color:var(--or);font-weight:600}
.st.done b,.st.cur b{background:var(--or);color:#fff;font-weight:700;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.st.cur b{box-shadow:0 0 0 3px var(--pe2)}
.st.cur{font-weight:700}

/* splash + login */
.splash{justify-content:space-between;cursor:pointer}
.brand{display:flex;flex-direction:column;align-items:center;padding-top:32px}
.appic{width:96px;height:96px;border-radius:24px;background:linear-gradient(#ff5a00,#ff4b0b);box-shadow:0 16px 36px -6px rgba(255,75,11,.35);display:grid;place-items:center;font-size:44px;line-height:1.29}
.logo{font:800 36px/36px var(--pj);letter-spacing:-.9px;color:var(--navy);margin-top:28px}
.logo b,.lname b{color:var(--or);font-weight:inherit}
.brand p{font:500 14px/20px var(--pj);letter-spacing:-.35px;color:var(--mu);margin-top:12px}
.sill{position:relative;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden}
.scene{position:relative;width:340px;height:220px}
.dots{position:relative;display:flex;gap:6px;padding:12px 0 24px}
.dots i{width:6px;height:6px;border-radius:9999px;background:rgba(102,112,133,.3)}
.dots i.on{width:20px;background:var(--or)}
.sill .homeind{position:relative;width:144px;background:rgba(16,42,67,.2);margin-bottom:8px}
.login{position:relative}
.lback{position:absolute;left:18px;top:40px;padding:6px}
.lhead{display:flex;flex-direction:column;align-items:center;margin-top:32px;text-align:center}
.lmark{display:flex;align-items:center;gap:8px}
.lbox{width:32px;height:32px;border-radius:12px;background:linear-gradient(#ff5a00,#ff4b0b);display:grid;place-items:center;font-size:20px;line-height:1;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.lname{font:700 24px/32px var(--pj);letter-spacing:-.6px;color:var(--navy)}
.lhead h1{font:700 24px/32px var(--pj);letter-spacing:-.6px;color:var(--navy);margin-top:20px}
.lhead p{font:400 13.5px/20.25px var(--pj);color:var(--mu);margin-top:3px}
.lform{padding:0 24px;margin-top:84px;display:flex;flex-direction:column;gap:16px}
.phin{display:flex;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:13px 15px;box-shadow:0 2px 2px rgba(0,0,0,.02)}
.phin:focus-within{border-color:var(--or)}
.cc{display:flex;align-items:center;gap:6px;font:700 12px/16px var(--pj);letter-spacing:-.3px;padding-right:10px}
.phin>i{width:.73px;height:20px;background:var(--ln);margin-right:8px}
.phin input,.otpin{flex:1;min-width:0;border:0;background:none;font:400 14px/20px var(--pj);color:var(--navy)}
.phin input:focus{outline:none}
.otpin{height:56px;border:1px solid var(--ln);border-radius:12px;background:#fff;text-align:center;font:700 24px var(--pj);letter-spacing:16px;padding-left:16px}
.otpin:focus{border-color:var(--or);outline:none}
.alt{text-align:center;font:400 12px/16px var(--pj);color:#000;margin-top:12px}
.alt button{font-weight:600;color:#fe5801}
.lform .ferr{margin:0}
.terms{text-align:center;font:400 11.5px/18.69px var(--pj);color:var(--mu);padding:0 40px;margin-bottom:16px}
.waves{position:relative;height:96px;flex:none}
.waves .homeind{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.8)}

/* onboarding (Untitled 9:96 welcome, 9:281 otp, 9:366 permissions, 3:7521 P02) */
.wel{position:relative}
.welbg{inset:0}
.wel>*{position:relative}.wel>.welbg{position:absolute}
.welh{text-align:center;margin-top:118px;padding:0 24px}
.welh h1{font:700 28px/35px var(--pj);letter-spacing:-.7px;color:var(--navy)}
.welh p{font:400 14px/22.75px var(--pj);color:var(--mu);margin-top:7.4px}
.welill{width:calc(100% - 50px);max-width:340px;height:190px;margin:60px auto 0}
.welill>.v{inset:0}
.wpin{position:absolute;top:78px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wpin.l{left:28px}.wpin.r{right:28px}
.wpin b{width:32px;height:32px;border-radius:50%;background:#fff0e6;display:grid;place-items:center}
.wpin i{width:12px;height:4px;border-radius:9999px;background:rgba(255,75,11,.2);filter:blur(.25px)}
.wrider{position:absolute;left:50%;top:34.2px;transform:translateX(-50%) scale(1.05);transform-origin:top center;display:flex;flex-direction:column;align-items:center}
.wrider i{width:96px;height:8px;margin-top:-8px;border-radius:9999px;background:rgba(16,42,67,.1);filter:blur(1px)}
.props{display:flex;gap:12px;padding:8px 24px}
.props div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.props span{width:48px;height:48px;border-radius:16px;background:#fff0e6;border:1px solid rgba(255,225,204,.5);display:grid;place-items:center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.05))}
.props b{font:700 12px/15px var(--pj);color:var(--navy);text-align:center}
.welf{padding:16px 24px 4px}
.welf .cta.tall{font:700 16px/24px var(--pj);letter-spacing:.4px;padding:16px 24px;box-shadow:0 8px 24px -4px rgba(255,75,11,.38)}
.welf .homeind{margin:24px auto 0;background:rgba(16,42,67,.2)}
.otpv2 .lhead,.otpv2 .lform{position:relative;z-index:1}
.otpv2 .lhead{margin-top:72px}
.vt{font:700 26px/32.5px var(--pj);letter-spacing:-.65px;color:var(--navy);margin-top:40px}
.otpv2 .lhead p{font:400 14px/22.75px var(--pj);margin-top:7.4px}
.otpv2 .lhead p b{font-weight:400;color:var(--navy);letter-spacing:.35px}
.otpv2 .lform{margin-top:32px;gap:20px}
.otpb{display:flex;justify-content:space-between;width:100%;max-width:326px;margin:0 auto}
.ob{width:44px;height:48px;border:1px solid var(--ln);border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05);text-align:center;font:700 20px/23px var(--pj);color:var(--navy)}
.ob:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 1px var(--or),0 1px 2px rgba(0,0,0,.05)}
.rsn{text-align:center;font:400 13px/19.5px var(--in);color:var(--mu)}
.rsn .tm{letter-spacing:.325px}
.cta.tall{height:auto;padding:14px 24px;font:400 15px/22.5px var(--pj);letter-spacing:.375px;box-shadow:0 8px 20px -4px rgba(255,75,11,.35)}
.otpv2 .cta{margin-top:20px}
.chg{align-self:center;font:400 14px/20px var(--pj);color:var(--or);padding:2px 0}
.owave{position:absolute;left:0;right:0;bottom:0;height:176px}
.owave .v{inset:0}
.owave .homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:144px;background:rgba(0,0,0,.8)}
.ntf{background:radial-gradient(491px 252px at 50% 100%,#fff1e8 0,rgba(255,241,232,.4) 60%,rgba(255,241,232,0) 80%) bottom/100% 280px no-repeat,radial-gradient(450px 126px at 50% 100%,rgba(255,225,204,.55) 0,rgba(255,225,204,.17) 55%,rgba(255,225,204,0) 75%) bottom/136% 180px no-repeat,var(--bg)}
.ntm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;text-align:center}
.nring{width:192px;height:192px;border-radius:50%;background:rgba(255,241,232,.6);display:grid;place-items:center;margin-bottom:36px}
.nring>div{width:144px;height:144px;border-radius:50%;background:rgba(255,225,204,.8);box-shadow:inset 0 2px 4px rgba(0,0,0,.05);display:grid;place-items:center}
.nring>div>div{width:96px;height:96px;border-radius:50%;background:#fff5ee;filter:drop-shadow(0 1px 1px rgba(0,0,0,.05));display:grid;place-items:center}
.ico.gear{width:48px;height:48px}
.ntt{display:flex;flex-direction:column;align-items:center;max-width:300px}
.ntt h1{font:700 24px/32px var(--pj);letter-spacing:-.6px;color:var(--navy)}
.ntt h1+p{font:400 14.5px/19px var(--in);color:var(--mu)}
.ntt p+h1{margin-top:15px}
.ntt p:last-child{font-size:14px}
.ntb{padding:0 24px 8px;display:flex;flex-direction:column;gap:12px}
.ntb .cta{height:48px;font:400 15px/22.5px var(--pj);letter-spacing:.375px;box-shadow:0 8px 20px -4px rgba(255,75,11,.45)}
.nn2{height:48px;border-radius:9999px;background:#f3f4f6;font:400 15px/22.5px var(--pj);letter-spacing:.375px;color:var(--mu);text-align:center}
.ntb .homeind{width:144px;margin:12px auto 0}
.shx{position:absolute;top:16px;right:20px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.sh.p02{position:relative;padding:28px 24px 4px;gap:0}
.gb{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:9999px;background:#e2e8f0}
.p2g{position:relative;width:96px;height:96px;margin:16px auto;display:grid;place-items:center}
.p2g::before{content:'';position:absolute;inset:-4.8px;border-radius:50%;background:#fff5f2}
.p2g img{position:relative}
.p02 h3{font:700 20px/26px var(--pj);color:var(--navy);margin-bottom:8px}
.p02 p{font:400 14px/20px var(--pj);color:var(--mu);max-width:268px;margin:0 auto 28px}
.p2b{height:48px;border-radius:25px;background:#ff4b0b;color:#fff;font:700 15px/22.5px var(--pj);text-align:center;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.p2b.s{background:var(--pe);color:var(--navy);box-shadow:none;margin-top:10px}
.p02 .homeind{width:128px;margin:24px auto 4px;background:rgba(0,0,0,.2)}

/* home */
.nh{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 4px}
.bell{position:relative;padding:8px;border-radius:50%}
.bell i{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--or);border:1px solid #fff}
.hero{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0;background:radial-gradient(341px at 331px 81px,#fff1e8 0,rgba(255,241,232,.3) 60%,rgba(255,241,232,0) 100%)}
.hero h1{font:800 20px/25px var(--pj);color:var(--navy)}
.hero h1 b{color:var(--or);font-weight:800}
.hero p{font:500 12px/19.5px var(--pj);color:var(--mu);margin-top:6px}
.pac{display:flex;align-items:center;gap:14px;margin:16px 20px 0;width:calc(100% - 40px);padding:15px;background:#fff;border:1px solid var(--pe2);border-radius:16px;box-shadow:var(--sh)}
.ib48,.ib44,.ib40{flex:none;border-radius:12px;background:var(--pe);display:grid;place-items:center}
.ib48{width:48px;height:48px}.ib44{width:44px;height:44px}.ib40{width:40px;height:40px}
.pac>span+span{flex:1}
.pac b{display:block;font:700 14px/19.25px var(--pj);color:var(--navy)}
.pac small{display:block;font:500 11px/13.75px var(--pj);color:var(--mu);margin-top:1.4px}
.types{display:flex;gap:12px;padding:0 20px;margin-top:12px}
.types button{flex:1;height:102px;background:#fff;border:1px solid var(--ln2);border-radius:12px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.05));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 12px/15px var(--pj);color:var(--navy);text-align:center}
.shd{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.shd h2{font:700 14px/20px var(--pj);letter-spacing:-.35px;color:var(--navy)}
.shd button{font:700 12px/16px var(--pj);color:var(--or)}
.px20{padding:0 20px}
.oc{display:flex;align-items:center;gap:12px;width:100%;padding:15px;background:#fff;border:1px solid var(--ln2);border-radius:16px;box-shadow:var(--sh)}
.oc+.oc{margin-top:10px}
.oci{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ocid{display:flex;align-items:center;gap:8px;font:700 12px/16px var(--pj);color:var(--navy)}
.bdg{font:600 10px/15px var(--pj);padding:2px 8px;border-radius:9999px;border:1px solid #d1fae5;background:#ecfdf5;color:var(--gr);white-space:nowrap}
.bdg.o{background:var(--pe);border-color:var(--pe2);color:var(--or)}
.bdg.b{background:var(--bl);border-color:var(--bl2);color:#3b5b8a}
.bdg.r{background:#fef3f2;border-color:#fee4e2;color:var(--rd)}
.rt{display:flex;align-items:center;padding-top:3px;font:500 12px/16px var(--pj);color:var(--navy);white-space:nowrap}
.rt span{padding-left:4px}
.ocs{font:400 11px/16.5px var(--pj);color:var(--mu)}
.oc>img{margin-left:4px}
.bn{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);padding:0 8px;background:#fff;border-top:1px solid var(--ln2);box-shadow:0 -4px 20px -2px rgba(16,42,67,.05)}
.bn>button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 10px/15px var(--pj);letter-spacing:-.25px;color:var(--mu)}
.bn .ico{margin-bottom:2px}
.bn .on{color:var(--or);font-weight:700}
